# The ingestion script enables a verified finite input. Ordinary stack startup is idle.
input {
  file {
    id => "phase4_input"
    path => ["${WINDOWS_APT_INPUT:/dataset/ingest-disabled.ndjson}"]
    mode => "read"
    exit_after_read => false
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed-${WINDOWS_APT_RUN:idle}.log"
    codec => plain { charset => "UTF-8" }
  }
}
filter {
  ruby {
    id => "phase4_evidence"
    path => "/usr/share/logstash/scripts/preserve_event.rb"
  }
}
output {
  if [@metadata][phase4_rejected] {
    file {
      id => "phase4_rejects"
      path => "/usr/share/logstash/data/rejected-${WINDOWS_APT_RUN:idle}.ndjson"
      codec => json_lines
      flush_interval => 0
    }
  } else {
    elasticsearch {
      id => "phase4_elasticsearch"
      hosts => ["https://elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      ssl_certificate_authorities => ["/usr/share/logstash/config/ca/ca.crt"]
      ssl_verification_mode => "full"
      index => "windows-apt-events-v1"
      document_id => "%{[event][id]}"
      action => "index"
      data_stream => "false"
      ilm_enabled => false
      manage_template => false
    }
  }
}
